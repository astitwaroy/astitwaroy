# Keeps the profile graphics fresh: the contribution snake and the activity graph.
# Lives at .github/workflows/snake.yml in the astitwaroy/astitwaroy repo.
name: Update profile graphics

on:
  schedule:
    - cron: "17 */6 * * *"    # every 6 hours (off the hour, so GitHub doesn't delay it)
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]          # also regenerate whenever you edit the README

permissions:
  contents: write             # needed to push to the "output" branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/activity_graph.py "${{ github.repository_owner }}" dist/activity-graph.svg

      - name: Push graphics to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile graphics"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
