# Put this file at:  .github/workflows/snake.yml  in the astitwaroy/astitwaroy repo
name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day (off the hour, so GitHub doesn't delay it)
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]          # also regenerate whenever you edit the README

permissions:
  contents: write             # needed to push to the "output" branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
